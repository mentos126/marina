name: MarinaCompanion

options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    CLANG_ENABLE_MODULES: YES
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_VERSION: "5.0"

targets:
  MarinaCompanion:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Marina.icns
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Resources/MarinaCompanion.entitlements
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 3
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        MARKETING_VERSION: 1.0.0
        PRODUCT_BUNDLE_IDENTIFIER: dev.marina.companion
        PRODUCT_MODULE_NAME: MarinaCompanion
        PRODUCT_NAME: MarinaCompanion

  MarinaCompanionTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: MarinaCompanion
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO
        PRODUCT_BUNDLE_IDENTIFIER: dev.marina.companion.tests

schemes:
  MarinaCompanion:
    build:
      targets:
        MarinaCompanion: all
        MarinaCompanionTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MarinaCompanionTests
    archive:
      config: Release
